name: Osprey feed

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: osprey
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check scores and send alerts
        env:
          NTFY_PREFIX: ${{ secrets.NTFY_PREFIX }}
        run: python feed.py
      - name: Save what we've already alerted on
        run: |
          git config user.name "osprey-bot"
          git config user.email "osprey-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
